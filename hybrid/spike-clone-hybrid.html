<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0B0D">
<title>YouTrain</title>
<link rel="manifest" href="spike-clone-hybrid.webmanifest">
<link rel="apple-touch-icon" href="spike-ff-icons/180.png">
<style>
:root{
  --bg:#0A0B0D; --surf:#14161A; --surf2:#1B1F26; --line:#262B34;
  --ink:#F2F4F6; --mut:#8B93A0; --dim:#5C6470;
  --acc:#D8FF3D; --acc-ink:#121600; --ok:#3DFFA5; --warn:#FFB03D; --bad:#FF6A5C;
  --r:20px; --tab-h:64px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;}
#app{max-width:430px;margin:0 auto;min-height:100dvh;position:relative;
  padding:0 16px calc(var(--tab-h) + 28px); }
.screen{display:none;animation:rise .28s ease;}
.screen.active{display:block;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
@keyframes ringdraw{from{stroke-dashoffset:251;}to{stroke-dashoffset:var(--ring-off);}}
@keyframes countflash{0%{color:var(--acc);}100%{color:var(--ink);}}

h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;}
.display{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;}
.display.md{font-size:34px;}
.num{font-variant-numeric:tabular-nums;font-weight:700;}
.mut{color:var(--mut);} .dim{color:var(--dim);}
.small{font-size:13px;} .tiny{font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
.tiny{font-weight:600;}
.volt{color:var(--acc);}

.topbar{padding:18px 2px 12px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-weight:800;letter-spacing:.14em;font-size:13px;}
.brand em{font-style:normal;color:var(--acc);}
.demopill{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--dim);
  border:1px solid var(--line);border-radius:99px;padding:4px 9px;}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin:12px 0;}
.card.flat{background:var(--surf2);border-color:transparent;}
.card h3{font-size:15px;}
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grow{flex:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mt{margin-top:12px;} .mb{margin-bottom:12px;}

.btn{display:block;width:100%;padding:16px;border-radius:16px;border:none;
  font-size:16px;font-weight:700;text-align:center;cursor:pointer;
  background:var(--acc);color:var(--acc-ink);}
.btn:active{transform:scale(.985);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.sub{background:var(--surf2);color:var(--ink);font-weight:600;font-size:14px;padding:13px;}
.btnrow{display:flex;gap:10px;margin-top:14px;}
.btnrow .btn{margin:0;}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;
  background:var(--surf2);font-size:12px;font-weight:600;color:var(--ink);border:1px solid var(--line);}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);}
.chip .dot{width:6px;height:6px;border-radius:99px;background:var(--ok);}

.pick{width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:16px;padding:16px;margin:8px 0;color:var(--ink);cursor:pointer;display:block;}
.pick.on{border-color:var(--acc);background:rgba(216,255,61,.06);}
.pick b{display:block;font-size:16px;margin-bottom:3px;}
.pick span{color:var(--mut);font-size:13px;}

.field{background:var(--surf2);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;width:100%;color:var(--ink);font-size:16px;font-weight:600;outline:none;}
.field:focus{border-color:var(--acc);}
label.lab{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);margin:12px 4px 6px;}

.seg{display:flex;background:var(--surf2);border-radius:14px;padding:4px;gap:4px;}
.seg button{flex:1;border:none;background:transparent;color:var(--mut);
  padding:10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;}
.seg button.on{background:var(--acc);color:var(--acc-ink);}
.seg.sm{padding:3px;}
.seg.sm button{padding:8px 6px;font-size:11px;}
.seg.sm button.on{background:var(--surf);color:var(--ink);}

input[type=range]{width:100%;appearance:none;height:44px;background:transparent;}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;
  background:linear-gradient(to right,var(--acc) var(--fill,50%),var(--surf2) var(--fill,50%));}
input[type=range]::-webkit-slider-thumb{appearance:none;width:26px;height:26px;border-radius:99px;
  background:var(--ink);margin-top:-10px;box-shadow:0 2px 10px rgba(0,0,0,.5);}
input[type=range].grey{opacity:.45;}

.ring{transform:rotate(-90deg);}
.ring .trk{stroke:#232A34;}
.ring .val{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:251;
  animation:ringdraw 1.1s ease forwards;}

.spark{width:100%;height:80px;display:block;}
.spark .band{fill:rgba(216,255,61,.07);}
.spark .ln{fill:none;stroke:var(--acc);stroke-width:2.5;}
.spark .pt{fill:var(--ink);stroke:var(--acc);stroke-width:2;}

.tier{display:flex;align-items:center;gap:14px;background:var(--surf);
  border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;
  color:var(--ink);cursor:pointer;text-align:left;margin:8px 0;}
.tier.on{border-color:var(--acc);background:rgba(216,255,61,.05);}
.tier .amt{font-size:22px;font-weight:800;min-width:74px;font-variant-numeric:tabular-nums;}
.tier .amt small{font-size:12px;color:var(--mut);font-weight:600;}
.tier .tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--acc-ink);background:var(--acc);border-radius:6px;padding:3px 7px;margin-left:6px;}
.radio{width:20px;height:20px;border-radius:99px;border:2px solid var(--dim);margin-left:auto;flex:none;}
.tier.on .radio{border-color:var(--acc);background:radial-gradient(circle at center,var(--acc) 0 6px,transparent 7px);}

.exrow{display:flex;align-items:center;gap:12px;background:var(--surf);
  border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;}
.sets{display:flex;gap:8px;margin-left:auto;}
.setc{width:44px;height:44px;border-radius:14px;background:var(--surf2);
  border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.setc.done{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);animation:pop .3s;}
.setc small{font-size:8px;font-weight:800;color:inherit;opacity:.65;}
.setc.next{border-color:var(--acc);border-style:dashed;}

.muschip{display:inline-flex;padding:4px 9px;border-radius:99px;
  background:rgba(216,255,61,.09);border:1px solid rgba(216,255,61,.22);
  color:var(--acc);font-size:10px;font-weight:700;letter-spacing:.04em;}
.musrow{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0;}
.avsq{width:46px;height:46px;border-radius:14px;object-fit:cover;object-position:top;
  border:1px solid var(--line);flex:none;}

.injcard{background:var(--surf2);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin:10px 0;}
.injcard .seg{margin:6px 0;}
.lab2{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);margin:10px 2px 4px;}
.micb{width:46px;height:46px;border-radius:14px;background:var(--surf2);
  border:1px solid var(--line);font-size:20px;cursor:pointer;flex:none;line-height:1;}
.micb:active{background:var(--acc);}

.rirsheet{position:fixed;inset:0;background:rgba(5,6,8,.6);backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;z-index:60;}
.rirsheet.open{display:flex;animation:rise .25s;}
.rirbox{background:var(--surf);border-radius:24px 24px 0 0;width:100%;max-width:430px;
  padding:20px 16px 34px;border-top:1px solid var(--line);}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px;}
.rirop{display:flex;gap:8px;margin:14px 0;}
.rirop button{flex:1;padding:18px 0;border-radius:14px;border:1px solid var(--line);
  background:var(--surf2);color:var(--ink);font-size:20px;font-weight:800;cursor:pointer;}
.rirop button:active{background:var(--acc);color:var(--acc-ink);}

.bar{height:10px;border-radius:99px;background:var(--surf2);overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;
  transition:width .5s ease;}
.bar.tall{height:16px;}
.macroline{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px;}
.macroline .lab2{width:54px;color:var(--mut);font-weight:600;}
.macroline .val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;}

.chatb{max-width:82%;padding:12px 15px;border-radius:18px;margin:8px 0;font-size:14px;line-height:1.45;}
.chatb.you{margin-left:auto;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px;font-weight:600;}
.chatb.coach{background:var(--surf2);border-bottom-left-radius:6px;}
.chatb.coach b{color:var(--acc);}
.chatscroll{height:230px;overflow:auto;padding:6px 2px;}
.coachin{display:flex;gap:8px;margin-top:12px;align-items:center;}

.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--bg);border-top:1px solid var(--line);
  display:flex;z-index:50;max-width:430px;margin:0 auto;}
.tabbar button{flex:1;border:none;background:transparent;color:var(--dim);
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;}
.tabbar .tic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.tabbar button.on{color:var(--ink);}
.tabbar button.on::before{content:"";position:absolute;margin-top:-26px;width:16px;height:3px;
  border-radius:99px;background:var(--acc);}

.statrow{display:flex;gap:10px;}
.stat{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:16px;
  padding:13px 14px;}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:3px;}

.note{font-size:12px;color:var(--dim);line-height:1.5;padding:10px 4px;}
.hr{height:1px;background:var(--line);margin:16px 0;}
.qfade{transition:opacity .2s;}
.bigemoji{font-size:30px;}
.toast{position:fixed;bottom:calc(var(--tab-h) + 20px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#0A0B0D;font-weight:700;font-size:13px;padding:11px 18px;
  border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:70;white-space:nowrap;}
.toast.show{opacity:1;}
.hero{position:relative;height:400px;border-radius:24px;overflow:hidden;
  background:var(--surf2);border:1px solid var(--line);margin:12px 0 6px;}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:top;transition:opacity .25s, filter .3s;}
.hero.muted img{filter:saturate(.55) contrast(.92);}
.stagechip{position:absolute;top:12px;left:12px;z-index:3;font-size:10px;font-weight:800;
  letter-spacing:.08em;color:#4E600F;background:#F7FFDD;border-radius:99px;padding:6px 11px;}
.stagepanel{position:absolute;left:0;right:0;bottom:0;z-index:3;
  background:rgba(10,11,13,.93);backdrop-filter:blur(8px);padding:10px 12px 12px;}
.scrubrow{display:flex;justify-content:space-between;align-items:center;}
.stop{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  padding:7px 14px;border-radius:14px;background:transparent;border:none;color:var(--ink);}
.stop .k{font-size:9px;letter-spacing:.1em;color:var(--dim);font-weight:800;text-transform:uppercase;}
.stop .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.stop.now .v{color:var(--acc);}
.stop.sel{background:rgba(216,255,61,.12);}
.trainerline{margin:2px 4px 4px;font-size:14px;font-weight:600;color:var(--ink);}
.hero.scrub{height:340px;}
.projchip{position:absolute;top:12px;right:12px;z-index:3;font-size:10px;font-weight:800;
  letter-spacing:.06em;color:var(--acc-ink);background:var(--acc);border-radius:99px;padding:6px 11px;text-align:right;}
.footer-tag{text-align:center;color:var(--dim);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;margin-top:22px;font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">FRANKEN<em>FIT</em></div>
    <div class="demopill">HYBRID V3 · STAND-INS + DEMO DATA</div>
  </div>
  <main id="routes"></main>
  <div class="footer-tag">stitched from the best · on-device only</div>
</div>
<nav class="tabbar" id="tabbar" style="display:none"></nav>

<div class="rirsheet" id="rirsheet">
  <div class="rirbox">
    <div class="grab"></div>
    <h3 id="rirtitle">Set done</h3>
    <div class="mut small" id="rirsub">How many more good reps were in the tank?</div>
    <div class="rirop" id="rirops"></div>
    <div class="note" id="rirhint">Reps-in-reserve adjusts your next set automatically — honest effort in, honest targets out.</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('spike-ff-sw.js').catch(()=>{}); }
</script>
<script>
/* ============ FRANKENFIT hybrid v0.3 — engine + data ============ */
const $ = s => document.querySelector(s);
const LS_KEY = 'frankenfit.v1';

const store = {
  data: null,
  load(){ try{ this.data = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ this.data=null; } },
  save(){ localStorage.setItem(LS_KEY, JSON.stringify(this.data)); },
  clear(){ localStorage.removeItem(LS_KEY); this.data=null; }
};

/* migration: older profiles get the new fields with honest defaults */
function normalizeData(d){
  if(!d || !d.profile) return d;
  const p=d.profile;
  if(p.bf===undefined) p.bf=null;
  if(!p.approach) p.approach='protein';
  if(!p.mode) p.mode='full';          // 'full' = log everything · 'min' = scale-first
  if(!p.injdetail){
    p.injdetail=(p.injuries||[]).filter(x=>x!=='none')
      .map(part=>({part,side:'',what:'',ago:'',status:'light',notes:''}));
  }
  if(p.lev===undefined) p.lev=null;   // levers applied: {days, def}
  if(d.prefs===undefined) d.prefs={};
  (d.plan&&d.plan.moves?d.plan.moves:[]).forEach(m=>{ if(!m.muscles) m.muscles=muscleOf(m.name); });
  return d;
}

/* exercise → muscles (fallback mapper for plans built before v0.3) */
function muscleOf(name){
  const n=(name||'').toLowerCase();
  if(n.includes('squat')||n.includes('leg press')) return ['Quads','Glutes','Core'];
  if(n.includes('rdl')||n.includes('romanian')) return ['Hamstrings','Glutes','Low back'];
  if(n.includes('hip thrust')) return ['Glutes','Hamstrings'];
  if(n.includes('calf')) return ['Calves'];
  if(n.includes('bench')||n.includes('chest')) return ['Chest','Triceps','Front delts'];
  if(n.includes('incline')) return ['Upper chest','Front delts','Triceps'];
  if(n.includes('shoulder press')||n.includes('ohp')) return ['Front delts','Side delts','Triceps'];
  if(n.includes('flye')||n.includes('cable')) return ['Chest','Front delts'];
  if(n.includes('row')||n.includes('pulldown')||n.includes('pull-up')) return ['Lats','Rhomboids','Biceps'];
  if(n.includes('curl')) return ['Biceps','Forearms'];
  if(n.includes('triceps')||n.includes('rope')||n.includes('dip')) return ['Triceps','Chest'];
  if(n.includes('farmer')||n.includes('carry')) return ['Grip','Traps','Core'];
  if(n.includes('lateral')||n.includes('raise')) return ['Side delts'];
  return ['Full body'];
}

/* --- crude honest engine: estimates, not gospel (locked principle: bands, not numbers) --- */
const FAT_KCAL=7700;
const ENG = {
  mifflin(p){ // p: {sex,age,cm,kg}
    const base = 10*p.kg + 6.25*p.cm - 5*p.age;
    return Math.round(base + (p.sex==='m' ? 5 : -161));
  },
  actMult(days){ return Math.min(1.55, 1.30 + days*0.055); },
  days(p){ return (p.lev && p.lev.days) || p.daysPerWeek; },
  tdee(p){ return Math.round(this.mifflin(p) * this.actMult(this.days(p))); },
  /* signed daily intake vs burn: negative = deficit, positive = surplus (build) */
  deficit(p){
    if(p.lev && p.lev.def!=null) return -Math.round(p.lev.def);
    if(p.goal==='build') return Math.round(this.tdee(p)*0.10);             // lean bulk
    if(p.goal==='recomp') return -Math.round(Math.min(400,Math.max(200,this.tdee(p)*0.06)));
    return -Math.round(Math.min(700, Math.max(300, this.tdee(p)*0.22)));   // honest cut
  },
  dailyBudget(p){ return this.tdee(p) + this.deficit(p); },
  proteinTarget(p){
    if(p.goal==='build') return Math.round(p.kg*2.2);
    if(p.goal==='recomp') return Math.round(p.kg*2.4);
    return Math.round(p.goalKg*2.1);
  },
  lbm(p){ return (p.bf!=null && p.bf>0 && p.bf<70) ? Math.round(p.kg*(1-p.bf/100)) : null; },
  /* over-budget days in the last 14 — the slippage the window answers to */
  slipDays(st){
    const p=st.profile, budget=this.dailyBudget(p);
    const cut=Date.now()-14*864e5; const map={};
    (st.foods||[]).forEach(f=>{
      const t=new Date((f.d||'')+'T12:00:00');
      if(isNaN(t)||t.getTime()<cut) return;
      map[f.d]=(map[f.d]||0)+f.kcal;
    });
    return Object.values(map).filter(k=>k>budget*1.15).length;
  },
  /* arrival: 4-week window that re-aims on EVERY log — strict pulls it left, sloppy pushes right */
  arrival(st){
    const p=st.profile;
    const kgNow=(st.weights&&st.weights.length)?st.weights[st.weights.length-1].kg:p.kg;
    const gain=p.goal==='build';
    const ratePct=p.goal==='recomp'?0.004:(gain?0.002:0.005);
    const rate=kgNow*ratePct;
    const dk=Math.max(0, gain ? (p.goalKg-kgNow) : (kgNow-p.goalKg));
    const wk=rate>0?dk/rate:0;
    const slip=this.slipDays(st);
    const half=2+Math.min(3, slip*0.08);                 // 4-wk window, widens with sloppiness
    const push=Math.min(2, slip*0.18);                   // window drifts right on over-budget weeks
    const eff=wk+push;
    const d=w=>{ const t=new Date(); t.setDate(t.getDate()+Math.round(w*7));
      return t.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(w>52?' \u2019'+String(t.getFullYear()).slice(2):''); };
    return { weeks:Math.round(eff), lo:d(Math.max(0,eff-half)), hi:d(eff+half),
             conf: Math.max(35, Math.min(88, 92 - wk*1.0)),
             kgNow, slip, gain, ratePct };
  },
  /* set-to-set adaptation (MacroFactor Workouts mechanic): RIR -> next load */
  nextLoad(load, rir){
    if(rir<=1) return Math.round((load+2.5)*2)/2;
    if(rir>=3) return Math.max(0, Math.round((load-2.5)*2)/2);
    return load;
  }
};

function fmtDate(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&"<>]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* voice-to-text (type it OR say it — same field) */
window.srFill=(targetId)=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Voice input needs Safari 14.5+ or Chrome — type it instead'); return; }
  const el=document.getElementById(targetId); if(!el) return;
  const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
  r.onresult=e=>{ const t=e.results[0][0].transcript;
    el.value=(el.value?el.value+' ':'')+t;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    toast('Heard: '+t); };
  r.onerror=()=>toast('No speech caught — try again');
  r.onend=()=>{};

    moves:[
      ['Bench Press',0.72,'8',['Chest','Triceps','Front delts'],'shoulder','Incline DB Press (shoulder-swap)'],

      ['Cable Flye',0.25,'12',['Chest','Front delts']],
      ['Triceps Rope',0.3,'12',['Triceps']]
    ]}

function buildPlan(a, prog){
  const days=a.daysPerWeek||4;
  if(!prog) prog = days<=3 ? 'fba' : 'ul';
  const kg=a.kg, f=a.equip==='min'?0.35:(a.equip==='home'?0.6:1);
  const inj=(a.injdetail&&a.injdetail.length?a.injdetail.map(x=>x.part):(a.injuries||[]));
  const mv=(name,bw,reps,muscles,swapInj,swap)=>{
    const o={name, kg:Math.max(0,Math.round(kg*bw*f/2.5)*2.5), reps, sets:4, muscles, done:[], rirs:[]};
    if(swapInj && inj.includes(swapInj)){ o.inj=swapInj; o.swap=swap; }
    return o;
  };
  const src=PLANS[prog]||PLANS.fba;
  return { name:src.name, prog, moves:src.moves.map(m=>mv(...m)) };
}
function injSummary(p){
  const L=p.injdetail||[];
  if(!L.length) return null;
  return L.map(x=>({
    label:`${x.part} (${x.side==='l'?'left':x.side==='r'?'right':x.side==='b'?'both':'unspecified side'}) · ${x.status==='full'?'trains full':x.status==='painfree'?'pain-free only':x.status==='light'?'light use only':'not using it yet'} · ${x.ago||'unknown when'}`,
    notes:[x.what,x.notes].filter(Boolean).join(' — ')
  }));
}

window.lvMove=()=>{
  const p=store.data.profile;
  const days=+($('#lv_days')?.value||ENG.days(p));
  const def=+($('#lv_def')?.value||300);
  const kgNow=arrNow();
  const tdee=Math.round(ENG.mifflin(p)*ENG.actMult(days));
  let kgwk=def*7/FAT_KCAL;
  const capped=kgwk > kgNow*0.0075;
  if(capped) kgwk=kgNow*0.0075;
  const dk=Math.max(0, p.goal==='build' ? p.goalKg-kgNow : kgNow-p.goalKg);
  const wk=kgwk>0?dk/kgwk:0;
  const d=w=>{ const t=new Date(); t.setDate(t.getDate()+Math.round(w*7));
    return t.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(w>52?' \u2019'+String(t.getFullYear()).slice(2):''); };
  const conf=Math.max(35,Math.min(88,92-wk*1.0));
  const el=id=>document.getElementById(id);
  if(!el('lv_window')) return;
  el('lv_daysv').textContent=days;
  el('lv_defv').textContent=def;
  el('lv_window').textContent = dk<=0 ? `${d(0)} — you're at goal` : `${d(Math.max(0,wk-2))} → ${d(wk+2)}`;
  el('lv_weeks').textContent = dk<=0 ? `arrival achieved — phase 2 is live` : `~${Math.round(wk)} weeks · ${Math.round(conf)}% confidence band`;
  el('lv_rate').textContent = `rate ${kgwk.toFixed(2)} kg/wk (${(kgwk/kgNow*100).toFixed(2)}% BW) — ` + (capped?'held at the muscle-loss line':'clean, under the cap');
  el('lv_cap').textContent = capped ? `⚠ past the muscle-loss line at this deficit — the engine holds the honest rate instead of lying to you` : `the bigger this number, the faster — up to the muscle-loss line`;
  el('lv_cap').style.color = capped ? 'var(--warn)' : '';
  el('lv_confbar').style.width = conf+'%';
};

function trainHint(m){
  const next=m.done.length;
  if(next>=m.sets) return `${m.kg} kg × ${m.reps} · all sets logged`;
  let kg=m.kg;
  for(let i=0;i<m.rirs.length;i++) kg=ENG.nextLoad(kg,m.rirs[i]);
  return `Set ${next+1}: ${kg} kg × ${m.reps}` + (m.rirs.length? ` · adapted from ${m.kg}`:'');

  const m=store.data.plan.moves[mi];
  if(m.done.includes(si)){
    m.done=m.done.filter(x=>x!==si);
    m.rirs=m.rirs.slice(0,m.done.length);
    store.save(); go('train'); return;
  }
  if(m.done.length!==si){ toast('Log sets in order — effort data lies otherwise'); return; }
  RIR_CTX={mi,si};
  $('#rirtitle').textContent=`${m.name} — set ${si+1} logged`;
  $('#rirops').innerHTML=[0,1,2,3,4].map(r=>

};

  go('train');

};

        <div><span class="num" style="font-size:26px;">≈ ${tdee.toLocaleString()}</span> <span class="mut small">kcal/day</span></div>
        <div class="chip"><span class="dot"></span>measured, not guessed</div>
      </div>
      <div class="note" style="padding:8px 0 0;">Back-calculated from what you ate × what the scale did. Watches estimate burn badly, so we don't ask them to.</div>
    </div>
    <div class="card">
      <div class="tiny dim">NEXT WEEK'S PLAN</div>
      ${adj===0
        ? `<div class="mt small">Trend is inside the band — <b>nothing changes</b>. Same calories, same deficit. Boring is the product working.</div>`
        : `<div class="mt small">Trend is ${adj<0?'slower':'faster'} than the honest rate → calories <b class="num">${adj>0?'+':'−'}${Math.abs(adj)}</b>/day next week. Small moves, re-measured in 7 days.</div>`}
      <div class="seg sm mt">
        ${[['coached','Coached'],['collab','Collaborative'],['manual','Manual']].map(([k,l])=>
          `<button class="${((st.prefs.mfMode)||'coached')===k?'on':''}" onclick="setMfMode('${k}')">${l}</button>`).join('')}
      </div>
    </div>
    <label class="lab">Log this morning's weight (kg)</label>
    <div class="row">
      <input class="field grow" type="number" step="0.1" id="ci_kg" placeholder="${last.kg}">
      <input class="field" type="number" step="0.5" id="ci_waist" placeholder="waist cm" style="width:110px;">
      <button class="btn" style="width:86px;" onclick="logWeight()">Log</button>
    </div>
    <div style="height:10px"></div>`;
}};
window.setMode=(m)=>{ store.data.profile.mode=m; store.save(); toast(m==='min'?'Scale-first — weigh-ins carry it all':'Full logging on'); go('checkin'); };
window.setMfMode=(m)=>{ store.data.prefs.mfMode=m; store.save(); go('checkin'); };
function sparkSVG(w){
  const W=340,H=80,P=8;
  const kgs=w.map(x=>x.kg), lo=Math.min(...kgs)-0.4, hi=Math.max(...kgs)+0.4;
  const X=i=>P+i*(W-2*P)/(Math.max(1,w.length-1));
  const Y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const pts=w.map((x,i)=>[X(i),Y(x.kg)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const bandTop=pts[0][1]-4, bandBot=pts[pts.length-1][1]+4;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <rect class="band" x="${P}" y="${Math.min(bandTop,bandBot)}" width="${W-2*P}" height="${Math.abs(bandBot-bandTop)+8}"/>
    <path class="ln" d="${path}"/>
    ${pts.map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2"/>`).join('')}
  </svg>`;
}
window.logWeight=()=>{
  const v=parseFloat($('#ci_kg')?.value);
  const ws=parseFloat($('#ci_waist')?.value);
  if(!v||v<40||v>250){ toast('That number looks off — try again'); return; }
  const e={d:new Date().toISOString().slice(0,10),kg:v};
  if(ws && ws>40 && ws<200) e.waist=ws;
  store.data.weights.push(e); store.save();
  toast('Logged. The window just re-aimed.');
  go('checkin');
};

/* ============ COACH (speak OR type OR tap — answers read the engine) ============ */
routes['coach'] = { tab:true, render(host){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const st=store.data, p=st.profile;
  host.innerHTML=`
    <h2 style="font-size:24px;margin-bottom:4px;">Coach</h2>
    <div class="mut small mb">Answers from your actual numbers. Type it, tap it${SR?', or hit the mic and say it':''}. Demo reads canned lines off your engine.</div>
    <div class="chatscroll" id="chat">
      <div class="chatb coach">You're ~${ENG.arrival(st).weeks} weeks out on the honest math. Ask me anything the engine can see.</div>
    </div>
    <div class="row wrap" style="gap:8px;">
      ${["Why did my calories change?","I'm stalling — panic?","Can I swap an exercise?","Why is protein the hero?","What happens at goal?","How does the window move?"].map(q=>
        `<button class="chip" onclick="ask('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('')}
    </div>
    <div class="coachin">
      <button class="micb" id="coachmic" title="speak" onclick="coachMic()">🎙</button>
      <input class="field grow" type="text" id="coachin" placeholder="${SR?'ask anything — or tap the mic':'ask anything'}" onkeydown="if(event.key==='Enter')coachSend()">
      <button class="btn sub" style="width:70px;" onclick="coachSend()">Send</button>
    </div>`;
}};
window.coachSend=()=>{
  const el=$('#coachin'); const q=(el?.value||'').trim();
  if(!q){ toast('Type it, tap a chip, or hit the mic'); return; }
  el.value='';
  renderTurn(q);
};
window.coachMic=()=>{ srFill('coachin'); };
window.ask=(q)=>renderTurn(q);
function renderTurn(q){
  const c=$('#chat'); if(!c){ go('coach'); return; }
  c.insertAdjacentHTML('beforeend',`<div class="chatb you">${esc(q)}</div><div class="chatb coach">${coachAnswer(q)}</div>`);
  c.scrollTop=c.scrollHeight;
}
function coachAnswer(q){
  const st=store.data, p=st.profile;
  const arr=ENG.arrival(st), d=ENG.deficit(p), pro=ENG.proteinTarget(p);
  const s=q.toLowerCase();
  const has=(...w)=>w.some(x=>s.includes(x));
  if(has('calorie','burn','deficit','surplus','tdee'))
    return `Your burn is <b>measured weekly</b>: food logged × scale trend → real expenditure (${arr.weeks===0?'—':'≈'+ENG.tdee(p).toLocaleString()+' kcal today'}). When last week's trend ran hot or cold, targets move ~100 kcal. It's arithmetic, not mood. In Coached mode it just happens; Collaborative asks you first.`;
  if(has('stall','stuck','plateau','panic'))
    return `No. A "stall" is usually water lying to the scale for 7–10 days. The band in your check-in chart exists for exactly this: trend inside band = <b>nothing changes</b>. We adjust on 2+ weeks of real drift, never on one bad Tuesday.`;
  if(has('swap','exercise','hurt','injur','pain','shoulder','knee','back','wrist','hip','ankle')){
    const L=injSummary(p)||[];
    return L.length
      ? `You gave me the details, so the program already respects them: ${L.map(x=>'<b>'+x.label+'</b>').join('<br>')}. Every flagged move carries a mapped swap — same muscle, friendlier joint — and the load prescription carries over.` 
      : `You told me nothing hurts, so nothing's swapped. If something flares: check-in → injuries get edited any time, and the program rebuilds around them.`;
  }
  if(has('protein'))
    return `Because the goal isn't weight loss — it's <b>fat loss with muscle intact</b>. ${pro}g/day + lifting tells your body which tissue to burn. That's the muscle-preservation play, and it's why Home says HOLDING.`;
  if(has('goal','maintain','decade','band','after'))
    return `The part nothing else builds: <b>maintenance, for the decade</b>. Your first three missions just get you to ${p.goalKg} kg — arriving is chapter 1. Phase 2 flips targets to your measured burn, the band (±3%) becomes the guardrail, drift gets caught at 3 days, and weeks-in-band becomes the metric you brag about in year 5.`;
  if(has('window','date','timeline','push','late','miss','log'))
    return `Your window is <b>${arr.lo} → ${arr.hi}</b> (~${arr.weeks} weeks, ±4). It re-aims on almost every log: meals in-budget and sessions finished pull it left; over-budget days (${arr.slip} in the last 14) push it right. Miss a week entirely? The trend still finds you at the scale — the window just widens. Strict is free speed.`;
  if(has('lean','body fat','bf','measure','waist','tape'))
    return p.bf!=null
      ? `You gave me ${p.bf}% — lean mass ≈ <b>${ENG.lbm(p)} kg</b>. Weight trend + waist tape keep the picture honest between scans; anything that keeps the trend true keeps the window true.`
      : `No BF% on file — that's fine, the engine runs without it. If you get a number (DEXA, calipers, smart scale), add it in check-ins and the lean-mass math sharpens. Waist tape in check-ins is the cheap secondary signal.`;
  return `Here's what I can see right now: burn ≈ <b>${ENG.tdee(p).toLocaleString()}</b> kcal/day, protein floor <b>${pro}g</b>, arrival <b>${arr.lo} → ${arr.hi}</b> (${arr.slip?arr.slip+' over-budget day'+(arr.slip>1?'s':'')+' in the last 14':'clean 14 days'}), tracking in <b>${p.mode==='min'?'scale-first':'full-log'}</b> mode. Ask me about any of those — or tap a chip below.`;
}

/* ============ YOU — avatar + milestone scrub (A/B/C always) + the decade ============ */
routes['you'] = { tab:true, render(host){
  const st=store.data, p=st.profile, arr=ENG.arrival(st);
  const created=new Date(st.ts);
  const maint=isMaint(st);
  const firstW=st.weights[0].kg;
  const tNow=Math.max(0,Math.min(100, Math.abs(arr.kgNow-firstW)/Math.max(.1,Math.abs(p.goalKg-firstW))*100 ));
  const waist=(st.weights.filter(x=>x.waist).slice(-1)[0]);
  host.innerHTML=`
    <h2 style="font-size:24px;margin-bottom:4px;">You, over time</h2>
    <div class="mut small mb">Day 0: ${fmtDate(created)} — the origin never leaves.</div>
    <div class="hero scrub" id="yhero">
      <img src="img/today.jpg" id="yimg_now" alt="now figure">
      <img src="img/dream-body.jpg" id="yimg_dream" style="opacity:${tNow/100}" alt="projected figure">
      <div class="projchip" id="yproj">NOW · ${arr.kgNow} kg</div>
      <div class="stagepanel">
        <div class="scrubrow">
          <button class="stop" id="ystop_then" onclick="yStop('then')"><span class="k">A · Then</span><span class="v">${p.kg}</span></button>
          <button class="stop now sel" id="ystop_now" onclick="yStop('now')"><span class="k">B · Now</span><span class="v">${arr.kgNow}</span></button>
          <button class="stop" id="ystop_dream" onclick="yStop('dream')"><span class="k">C · Dream</span><span class="v">${p.goalKg}</span></button>
        </div>
        <input type="range" min="0" max="100" step="1" value="${Math.round(tNow)}" id="yscrub"
          oninput="yScrub(this.value)" style="--fill:${tNow}%">
        <div class="row between tiny dim"><span>day 0</span><span id="ymslabel">slide to see you at milestones</span><span>goal</span></div>
      </div>
    </div>
    <div class="tiny dim" style="margin:0 4px;">scrub = projected you at that point of the timeline (stand-in figures; the real avatar morphs once it renders from your photos)</div>
    <div class="statrow mt">
      <div class="stat"><div class="v num">${maint?'0':arr.weeks}</div><div class="k">${maint?'Weeks in band':'Weeks to arrival (mid)'}</div></div>
      <div class="stat"><div class="v num">${ENG.lbm(p)?ENG.lbm(p)+'<span class="dim" style="font-size:12px;"> kg LBM</span>':'—'}</div><div class="k">${p.bf!=null?'from your '+p.bf+'%':'add BF% to unlock'}</div></div>
    </div>
    <div class="card mt">
      <div class="tiny dim" style="color:${maint?'var(--ok)':'var(--acc)'};">${maint?'PHASE 2 · LIVE':'MISSIONS 1–3 = THE BEGINNING'}</div>
      <div class="small mt" style="line-height:1.55;">
        ${maint
          ? `You made it. The real work starts now: <b>stay inside the band (±3%)</b>. Weeks-in-band is the decade's scoreboard, the drift alarm is your early-warning system, and maintenance billing auto-halves. This is the product.`
          : `These first missions only get you <b>to ${p.goalKg} kg inside the band</b> — arriving is chapter 1, not the story. The real work is Phase 2: <b>staying there for the decade</b>, weeks-in-band as the scoreboard, drift caught at 3 days not +9 kg. That's what this app is for.`}
      </div>
    </div>
    <div class="card">
      <div class="row between"><b>Drift alarm</b><span class="chip" onclick="driftDemo()"><span class="dot" style="background:var(--warn);"></span>demo</span></div>
      <div class="note" style="padding:8px 0 2px;" id="driftmsg">In maintenance, 3 days above the band top pings you while it's still a nudge — not at +9 kg when it's a crisis. ~80% of regain is a detection problem.</div>
    </div>
    <div class="card flat">
      <div class="tiny dim">TRACKING, LOOSELY</div>
      <div class="small mt" style="line-height:1.5;">Mode: <b>${p.mode==='min'?'Scale-first':'Log everything'}</b> · waist ${waist?`<b>${waist.waist} cm</b> (${waist.d})`:'not logged yet'}
        <br>${p.mode==='min'?'The scale alone keeps the avatar and the window honest — no meal logging required.':'Change to Scale-first any time in check-ins — weigh-ins alone carry the whole loop.'}</div>
      <button class="btn sub mt" onclick="go('checkin')">Adjust tracking →</button>
    </div>
    <button class="btn ghost mt" onclick="wipeDemo()">Reset demo (wipe device data)</button>`;
}};
window.yScrub=(tRaw)=>{
  const t=Math.max(0,Math.min(100,+tRaw));
  const st=store.data, p=st.profile;
  const firstW=st.weights[0].kg, goal=p.goalKg;
  const kg=firstW+(goal-firstW)*t/100;
  const img=$('#yimg_dream'), chip=$('#yproj'), lab=$('#ymslabel'), sl=$('#yscrub');
  if(img) img.style.opacity=(t/100).toFixed(3);
  if(sl) sl.style.setProperty('--fill',t+'%');
  const arrP=ENG.arrival(st);
  const rate=arrP.kgNow*arrP.ratePct;
  const rem=Math.abs(kg-arrP.kgNow);
  const wks=rate>0?Math.round(rem/rate):0;
  const dt=new Date(); dt.setDate(dt.getDate()+wks*7);
  const name=t<=0?'DAY 0':t<33?'EARLY':t<67?'HALFWAY':t<99?'CLOSE':'GOAL';
  if(chip) chip.textContent=`${name} · ${kg.toFixed(1)} kg · ~${wks} wks`;
  if(lab) lab.textContent=t<=0?'origin — where this started':`projected: ${dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  ['then','now','dream'].forEach(s=>{
    const el=$('#ystop_'+s); if(el) el.classList.toggle('sel',(s==='then'&&t<=2)||(s==='now'&&t>2&&t<98)||(s==='dream'&&t>=98));
  });
};
window.yStop=(s)=>{
  const st=store.data, p=st.profile, arr=ENG.arrival(st);
  const firstW=st.weights[0].kg;
  const tNow=Math.max(0,Math.min(100, Math.abs(arr.kgNow-firstW)/Math.max(.1,Math.abs(p.goalKg-firstW))*100 ));
  const sl=$('#yscrub');
  const hero=$('#yhero'), imgs=$('#yimg_now'), imgd=$('#yimg_dream');
  if(s==='then'){
    if(sl){ sl.value=0; window.yScrub(0); }
    if(imgs) imgs.style.filter='saturate(.55) contrast(.92)';
    const chip=$('#yproj'); if(chip) chip.textContent=`THEN · ${p.kg} kg · day 0`;
  } else if(s==='now'){
    if(sl){ sl.value=Math.round(tNow); window.yScrub(Math.round(tNow)); }
    if(imgs) imgs.style.filter='';
    const chip=$('#yproj'); if(chip) chip.textContent=`NOW · ${arr.kgNow} kg`;
  } else {
    if(sl){ sl.value=100; window.yScrub(100); }
    if(imgs) imgs.style.filter='';
    const chip=$('#yproj'); if(chip) chip.textContent=`DREAM · ${p.goalKg} kg`;
  }
};
window.driftDemo=()=>{ $('#driftmsg').innerHTML='<b style="color:var(--warn);">Demo ping:</b> "Scale\'s been 1.1% over band for 3 days. Not a crisis — a Tuesday fix: protein + a walk, re-check Friday."'; };
window.wipeDemo=()=>{ if(confirm('Wipe demo data on this device?')){ store.clear(); QUIZ.step=0; location.hash=''; go('quiz'); } };

  commitProfile();
  const D=store.data;
  D.profile.bf=24.5;
  D.plan=buildPlan(D.profile,'fba');
  const d1=new Date(Date.now()-2*864e5).toISOString().slice(0,10);
  const d2=new Date(Date.now()-6*864e5).toISOString().slice(0,10);

  D.foods.push(
    {d:d1,name:'Pizza night (over budget)',kcal:Math.round(budget*1.30),p:40,c:120,fa:30,est:true},
    {d:d2,name:'Buffet dinner (over budget)',kcal:Math.round(budget*1.25),p:50,c:110,fa:35,est:true});
  store.save();
}
const startRoute=(location.hash||'').replace('#/','');
go(store.data && store.data.onboarded ? (routes[startRoute]?startRoute:'home') : 'quiz');
window.addEventListener('hashchange',()=>{ const r=(location.hash||'').replace('#/',''); if(r!==curRoute) go(r); });
